<!DOCTYPE html>
<html lang="en"><head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Workouts">
<title>Workouts</title>
<style>
body{font-family:-apple-system,sans-serif;margin:0;background:#111;color:#eee;padding:20px 16px 40px}
h1{font-size:26px;margin:10px 0 4px}.sub{color:#999;margin-bottom:16px}
.days{display:flex;gap:6px;overflow-x:auto;margin-bottom:18px}
.days button{flex:1;padding:10px 0;border:0;border-radius:10px;background:#222;color:#ccc;font-weight:600}
.days button.on{background:#ff6b35;color:#fff}.days button.done{outline:2px solid #3ddc84}
.sec{color:#ff6b35;font-weight:700;margin:18px 0 8px;font-size:14px;text-transform:uppercase}
.item{display:flex;align-items:center;gap:12px;background:#1d1d1d;padding:14px;border-radius:12px;margin-bottom:10px}
.item input{width:24px;height:24px;accent-color:#3ddc84;flex-shrink:0}
.item.checked span{text-decoration:line-through;color:#777}
.bar{height:8px;background:#222;border-radius:4px;margin:6px 0 10px}.fill{height:100%;background:#3ddc84;border-radius:4px}
.note{color:#999;font-size:13px}
</style></head><body>
<h1 id="title"></h1><div class="sub" id="sub"></div>
<div class="days" id="days"></div>
<div class="bar"><div class="fill" id="fill"></div></div>
<div id="list"></div>
<script>
const S="4×8–12";
const plan={
Mon:{t:"Push: chest, shoulders, triceps",note:"Warm up with 1–2 light sets of the first exercise. Last set close to failure.",
 gym:["Dumbbell bench press "+S,"Incline chest press machine "+S,"Cable flyes "+S,"Dumbbell shoulder press "+S,"Lateral raises "+S,"Cable tricep pushdowns "+S,"Skull crushers "+S],
 run:["Easy run 3–4 mi"]},
Tue:{t:"Pull: back & biceps",note:"Warm up with 1–2 light sets of the first exercise. Last set close to failure.",
 gym:["Lat pulldown "+S,"Seated cable row "+S,"Single-arm dumbbell row "+S,"Face pulls "+S,"Dumbbell curls "+S,"Hammer curls "+S],
 run:["Track / speed workout 4–5 mi total"]},
Wed:{t:"Legs",note:"Warm up with 1–2 light sets of the first exercise. No run tonight, let your legs recover.",
 gym:["Leg press or Smith machine squats "+S,"Dumbbell Romanian deadlifts "+S,"Leg extensions "+S,"Hamstring curls "+S,"Walking lunges "+S,"Calf raises "+S],
 run:[]},
Thu:{t:"Shoulders & arms",note:"Warm up with 1–2 light sets of the first exercise. Last set close to failure.",
 gym:["Machine shoulder press "+S,"Cable lateral raises "+S,"Rear delt machine "+S,"Cable curls "+S,"Overhead cable tricep extensions "+S],
 run:["Tempo run 4–6 mi"]},
Fri:{t:"Upper body mix",note:"Warm up with 1–2 light sets of the first exercise. Last set close to failure.",
 gym:["Incline dumbbell press "+S,"Lat pulldown "+S,"Chest-supported row "+S,"Push-ups "+S,"Dumbbell curls "+S,"Tricep dips "+S],
 run:["Easy run 3 mi (or rest)"]},
Sat:{t:"Rest day",note:"Full rest before the long run.",gym:[],run:["Rest & recover"]},
Sun:{t:"Long run",note:"Easy, conversational pace.",gym:[],run:["Long run 6–13 mi"]}};
const keys=Object.keys(plan),names={Mon:"Monday",Tue:"Tuesday",Wed:"Wednesday",Thu:"Thursday",Fri:"Friday",Sat:"Saturday",Sun:"Sunday"};
const now=new Date(),today=keys[(now.getDay()+6)%7];
const mon=new Date(now);mon.setDate(now.getDate()-(now.getDay()+6)%7);
const wk="wk2-"+mon.toDateString();
let data=JSON.parse(localStorage.getItem(wk)||"{}"),sel=today;
const all=k=>[...plan[k].gym,...plan[k].run];
function save(){localStorage.setItem(wk,JSON.stringify(data))}
function row(x,i){const c=data[sel][i];
 return `<label class="item ${c?'checked':''}"><input type="checkbox" ${c?'checked':''} onchange="data[sel][${i}]=this.checked;save();render()"><span>${x}</span></label>`}
function render(){
 const p=plan[sel];data[sel]=data[sel]||[];
 document.getElementById("title").textContent=names[sel]+(sel===today?" (Today)":"");
 document.getElementById("sub").textContent=p.t;
 document.getElementById("days").innerHTML=keys.map(k=>{
  const d=(data[k]||[]).filter(Boolean).length>=all(k).length;
  return `<button class="${k===sel?'on':''} ${d?'done':''}" onclick="sel='${k}';render()">${k}</button>`}).join("");
 let h=`<div class="note">${p.note}</div>`;
 if(p.gym.length)h+=`<div class="sec">Morning: Gym</div>`+p.gym.map((x,i)=>row(x,i)).join("");
 if(p.run.length)h+=`<div class="sec">${p.gym.length?"Evening: Run":"Today"}</div>`+p.run.map((x,i)=>row(x,i+p.gym.length)).join("");
 document.getElementById("list").innerHTML=h;
 const n=data[sel].filter(Boolean).length;
 document.getElementById("fill").style.width=(n/all(sel).length*100)+"%";
}
render();
</script></body></html>
