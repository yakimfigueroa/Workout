<!DOCTYPE html>
<html lang="en"><head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Workouts">
<title>Workouts</title>
<style>
body{font-family:-apple-system,sans-serif;margin:0;background:#111;color:#eee;padding:20px 16px 40px}
h1{font-size:26px;margin:6px 0 4px}.sub{color:#999;margin-bottom:14px}
.top{display:flex;gap:8px;margin-bottom:12px}
.top button,.btn{flex:1;padding:10px;border:0;border-radius:10px;background:#222;color:#ccc;font-weight:600;font-size:15px}
.top button.on{background:#ff6b35;color:#fff}
.days{display:flex;gap:6px;overflow-x:auto;margin-bottom:16px}
.days button{flex:1;padding:10px 0;border:0;border-radius:10px;background:#222;color:#ccc;font-weight:600}
.days button.on{background:#ff6b35;color:#fff}.days button.done{outline:2px solid #3ddc84}
.sec{color:#ff6b35;font-weight:700;margin:18px 0 8px;font-size:14px;text-transform:uppercase}
.item{display:flex;align-items:center;gap:12px;background:#1d1d1d;padding:14px;border-radius:12px;margin-bottom:10px}
.item input[type=checkbox]{width:24px;height:24px;accent-color:#3ddc84;flex-shrink:0}
.item.checked span{text-decoration:line-through;color:#777}
.bar{height:8px;background:#222;border-radius:4px;margin:4px 0 10px}.fill{height:100%;background:#3ddc84;border-radius:4px}
.note{color:#999;font-size:13px}
input.tx{width:100%;box-sizing:border-box;background:#1d1d1d;color:#eee;border:1px solid #333;border-radius:10px;padding:12px;font-size:16px}
.erow{display:flex;gap:8px;margin-bottom:8px}.erow .x
